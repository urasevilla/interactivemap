# Publishes the site to GitHub Pages.
#
# There is no build step — the repository is the site — so this just uploads the
# working tree. Enable it under Settings -> Pages by setting Source to
# "GitHub Actions". If you would rather deploy straight from a branch, delete
# this file and pick "Deploy from a branch" instead; both work.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated map index is current
        run: |
          node tools/build-index.mjs
          if ! git diff --quiet -- data/world-index.json; then
            echo "::error::data/world-index.json is stale — run 'npm run build:index' and commit the result."
            exit 1
          fi

      # enablement turns Pages on via the API if it is off, so a fresh clone of
      # this repo deploys without anyone visiting Settings first. Without it the
      # step fails with a bare "Not Found" that reads like a missing file.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
